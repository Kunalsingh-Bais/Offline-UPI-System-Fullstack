spring:
  application:
    name: Auth-service

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/Upi_auth_db?createDatabaseIfNotExist=true
    username: root
    password: Kunalroot123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Server Configuration
server:
  port: 8081

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-register: true
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: mySuperSecretKeyForOfflineUpiSystemThatIsLongEnoughForHS256Algorithm
  expiration: 86400000

# Logging
logging:
  level:
    org.springframework.security: DEBUG





