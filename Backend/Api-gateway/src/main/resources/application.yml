spring:
  application:
    name: Api-gateway

 # Spring cloud gateway configuration
  cloud:
    gateway:
      discovery:                             # Enable service discovery for routing
        locator:
          enabled: true
          lower-case-service-id: true

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:3000"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
              - "HEAD"
            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
              - "Content-type"
              - "Access-Control-Allow-Origin"
            allowCredentials: true
            maxAge: 3600

      routes:
        # Route for Auth Service
        - id: auth-service
          uri: lb://Auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # Route for User Service
        - id: user-service
          uri: lb://User-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # Route for Transaction Service
        - id: transaction-service
          uri: lb://Transaction-Service
          predicates:
            - Path=/api/transaction/**
          filters:
            - StripPrefix=1

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Logging (helpful for debugging)
logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG


