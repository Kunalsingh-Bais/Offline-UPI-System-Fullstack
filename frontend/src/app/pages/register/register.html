<div class="flex flex-col items-center justify-center min-h-screen p-2 font-sans bg-gradient-to-br from-blue-50 via-white to-indigo-100 sm:p-4">
  <div class="w-full max-w-xl animate-fadeIn">
    
    <!-- Compact Premium Card -->
    <div class="p-6 bg-white border border-gray-100 shadow-2xl sm:p-8 rounded-3xl">

      <!------ Tighter Header ------>
      <div class="mb-5 text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 mb-2 text-2xl shadow-inner bg-blue-50 rounded-xl">
          🚀
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">
          Create Account
        </h1>      
        <p class="mt-1 text-sm font-medium text-gray-500">
          Join the UPI payment network
        </p> 
      </div>

      <!------ Compact Registration Steps ------>
      <div class="flex items-center justify-center mb-6 space-x-2 text-[9px] font-bold tracking-widest uppercase sm:space-x-4">
        <div class="flex flex-col items-center gap-1">
          <div class="flex items-center justify-center w-6 h-6 transition-all rounded-full shadow-sm" [ngClass]="registrationStep >= 1 ? 'bg-green-900 text-white' : 'bg-gray-100 text-gray-400'">
            <span *ngIf="registrationStep >= 1">✓</span><span *ngIf="registrationStep < 1">1</span>
          </div>
          <span [ngClass]="registrationStep >= 1 ? 'text-slate-900' : 'text-gray-400'">Auth</span>
        </div> 
        <div class="w-6 sm:w-10 h-0.5 rounded-full mb-4" [ngClass]="registrationStep >= 2 ? 'bg-slate-900' : 'bg-gray-200'"></div> 
        <div class="flex flex-col items-center gap-1">
          <div class="flex items-center justify-center w-6 h-6 transition-all rounded-full shadow-sm" [ngClass]="registrationStep >= 2 ? 'bg-slate-900 text-white' : 'bg-gray-100 text-gray-400'">
            <span *ngIf="registrationStep >= 2">✓</span><span *ngIf="registrationStep < 2">2</span>
          </div>
          <span [ngClass]="registrationStep >= 2 ? 'text-slate-900' : 'text-gray-400'">Profile</span>
        </div> 
        <div class="w-6 sm:w-10 h-0.5 rounded-full mb-4" [ngClass]="registrationStep >= 3 ? 'bg-slate-900' : 'bg-gray-200'"></div>
        <div class="flex flex-col items-center gap-1">
          <div class="flex items-center justify-center w-6 h-6 transition-all rounded-full shadow-sm" [ngClass]="registrationStep >= 3 ? 'bg-slate-900 text-white' : 'bg-gray-100 text-gray-400'">
            <span *ngIf="registrationStep >= 3">✓</span><span *ngIf="registrationStep < 3">3</span>
          </div>
          <span [ngClass]="registrationStep >= 3 ? 'text-slate-900' : 'text-gray-400'">Done</span>
        </div> 
      </div>

      <!------ Floating Alerts (Thinner) ------>
      <div *ngIf="errorMessage" class="flex items-center justify-between p-3 mb-4 transition-all border border-red-200 bg-red-50 text-red-700 rounded-xl animate-slideDown">
        <div class="flex items-center gap-2">
          <span class="text-lg">❌</span>
          <p class="text-xs font-semibold">{{ errorMessage }}</p>
        </div> 
        <button (click)="clearError()" class="text-base font-bold text-red-400 transition-colors hover:text-red-700 active:scale-95">✕</button>
      </div>

      <div *ngIf="successMessage" class="flex items-center justify-between p-3 mb-4 transition-all border border-emerald-200 bg-emerald-50 text-emerald-700 rounded-xl animate-slideDown">
        <div class="flex items-center gap-2">
          <span class="text-lg">✅</span>  
          <p class="text-xs font-semibold">{{ successMessage }}</p>
        </div>
      </div>

      <!------ Registration form (Reduced space-y and gaps) ------>
      <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-3">
        
        <!-- Row 1: Name & Email -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">Full Name</label>
            <input type="text" formControlName="name"   
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['name'].errors}">
            <div *ngIf="submitted && f['name'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
              <span *ngIf="f['name'].errors['required']">Required</span>  
              <span *ngIf="f['name'].errors['minlength']">Min 2 chars</span>
            </div>
          </div>
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">Email</label>
            <input type="email" placeholder="name@example.com" formControlName="email" 
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['email'].errors}">
            <div *ngIf="submitted && f['email'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
                <span *ngIf="f['email'].errors['required']">Required</span>
                <span *ngIf="f['email'].errors['email']">Invalid email</span>
            </div>
          </div> 
        </div>

        <!-- Row 2: Password & Confirm -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">Password</label>
            <input type="password" placeholder="Min 6 chars" formControlName="password" 
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['password'].errors}">
            <div *ngIf="submitted && f['password'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
              <span *ngIf="f['password'].errors['required']">Required</span> 
              <span *ngIf="f['password'].errors['minlength']">Min 6 chars</span>
            </div>
          </div>
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">Confirm Password</label>
            <input type="password" placeholder="Confirm" formControlName="confirmPassword" 
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': (submitted && f['confirmPassword'].errors) || (submitted && !passwordsMatch)}">
            <div *ngIf="submitted && f['confirmPassword'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
              <span *ngIf="f['confirmPassword'].errors['required']">Required</span> 
            </div>
            <div *ngIf="submitted && !passwordsMatch" class="mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">Mismatch</div>
          </div>
        </div>

        <!-- Row 3: Phone & Upi -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">Phone</label>
            <input type="text" placeholder="10 digits" formControlName="phone" 
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['phone'].errors}">
            <div *ngIf="submitted && f['phone'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
              <span *ngIf="f['phone'].errors['required']">Required</span>  
              <span *ngIf="f['phone'].errors['pattern']">Invalid format</span>
            </div>
          </div> 
          <div>
            <label class="block mb-1 text-[10px] font-bold tracking-widest text-gray-400 uppercase">UPI ID</label>
            <input type="text" placeholder="name@upi" formControlName="upiId"
              class="w-full px-3 py-2.5 text-sm font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
              [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['upiId'].errors}">
            <div *ngIf="submitted && f['upiId'].errors" class="flex flex-col gap-0.5 mt-1 text-[10px] font-bold text-red-500 animate-fadeIn">
              <span *ngIf="f['upiId'].errors['required']">Required</span>
              <span *ngIf="f['upiId'].errors['pattern']">Must end with @upi</span>
            </div>
          </div>
        </div>

        <!-- Submit button (Thinner) -->
        <div class="pt-2">
          <button type="submit" [disabled]="loading" 
            class="flex items-center justify-center w-full py-3 text-base font-bold text-white transition-all shadow-md bg-green-900 hover:bg-green-800 rounded-xl active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
            <span *ngIf="!loading">Create Account</span>
            <span *ngIf="loading" class="flex items-center gap-2">
              <div class="w-4 h-4 border-2 border-white rounded-full border-t-transparent animate-spin"></div>
              Creating...
            </span>      
          </button>
        </div>
      </form>

      <!-- Login link -->
      <div class="mt-5 text-center">
        <p class="text-sm font-medium text-gray-500">
          Already have an account?
          <a routerLink="/login" class="font-bold text-blue-600 transition-colors hover:text-blue-800 hover:underline">
            Login here
          </a>
        </p>
      </div>
      
    </div>
  </div>
</div>

<style>
  .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
  .animate-slideDown { animation: slideDown 0.2s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
</style>
