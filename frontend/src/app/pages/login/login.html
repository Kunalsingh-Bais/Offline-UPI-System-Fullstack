<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-lg p-8">
       
      <!------ Header ------>
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          UPI Login
        </h1>

        <p class="text-gray-600 text-sm">
          Sign in to your account
        </p>
      </div>

      <!------ Error Alert ------>
      <div 
        *ngIf="errorMessage"
        class="mb-4 bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded"
        role="alert">
        
        <div class="flex items-center">
          <span class="text-xl mr-3">❌</span>
          <p class="text-sm">{{ errorMessage }}</p>
        </div>

        <button
          (click)="clearError()"
          class="float-right text-red-500 hover:text-red-700 font-bold text-lg">
          x
        </button>
      </div>

      <!------ Success Alert ------>
      <div
        *ngIf="successMessage"
        class="mb-4 bg-green-50 border-l-4 border-green-500 text-green-700 p-4 rounded"
        role="alert">
        
        <div class="flex items-center">
          <span class="text-xl mr-3">✅</span>
          <p class="text-sm">{{ successMessage }}</p>
        </div>

        <button
          (click)="clearSuccess()"
          class="float-right text-green-500 hover:text-green-700 font-bold text-lg">
          x
        </button>
      </div>

      <!------ Login Form ------>
      <form [formGroup]="loginForm" (ngSubmit)="OnLogin()" class="space-y-6">
        <!-- Email field -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>

          <input type="email" id="email" placeholder="john@example.com" formControlName="email"
          class="block w-full px-4 py-2 border border-gray-300 rounded-lg  
                 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm"
                 
          [ngClass]="{'border-red-500 focus:ring-red-500': submitted && 
          f['email'].errors}">

          <!-- Validation errors-->
          <div *ngIf="submitted && f['email'].errors" class="mt-1 text-red-600 text-sm">
            <p *ngIf="f['email'].errors['required']">
              ❌ Email is required
            </p>
            <p *ngIf="f['email'].errors['email']">
              ❌ Please enter a valid email
            </p>
          </div>
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Password
          </label>

          <input type="password" id="password" placeholder="Enter the password" formControlName="password" 
          class="block w-full px-4 py-2 border border-gray-300 rounded-lg 
                 focus:ring-2 focus:ring-blue-500 focus:border-blue-500
                 transition text-sm"
          [ngClass]="{'border-red-500 focus:ring-red-500': submitted && 
          f['password'].errors}">

          <!-- Validation error-->
          <div *ngIf="submitted && f['password'].errors" class="mt-1 text-red-600 text-sm">
            <p *ngIf="f['password'].errors['required']">
              ❌ Password is required
            </p>
            <p *ngIf="f['password'].errors['minlength']">
              ❌Password must contains at least 6 characters
            </p>
          </div>
        </div>
        
        <!------ Login Button ------>
        <button type="submit" [disabled]="loading" 
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
                 py-2 rounded-lg transition disabled:bg-gray-400
                 disabled:cursor-not-allowed">
          <!-- Normal state -->
          <span *ngIf="!loading">
            Login
          </span>

          <!-- Loading state -->
          <span *ngIf="loading" class="flex items-center justify-center">
            <svg class="animate-spin h-5 w-5 mr-2 text-white"
              xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Logging in...
          </span>
        </button>

      </form>

      <!------ Divider ------>
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-400"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500"> Or </span>
        </div>
      </div>

      <!------ Register Link ------>
      <p class="text-center text-gray-600 text-sm">
        Don't have an account?
        <a routerLink="/register"
           class="text-blue-600 hover:text-blue-700 font-semibold
                  hover:underline transition">
           Register here       
        </a>
      </p>

    </div>
  </div>
</div>
