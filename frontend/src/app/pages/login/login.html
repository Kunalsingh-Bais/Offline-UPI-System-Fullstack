<div class="flex flex-col items-center justify-center min-h-screen p-4 font-sans bg-gradient-to-br from-blue-50 via-white to-indigo-100 sm:p-8">
  <div class="w-full max-w-md animate-fadeIn">
    
    <!-- Premium Card Container -->
    <div class="p-8 bg-white border border-gray-100 shadow-2xl sm:p-10 rounded-3xl">
       
      <!------ Header ------>
      <div class="mb-10 text-center">
        <!-- Logo / Icon -->
        <div class="inline-flex items-center justify-center w-16 h-16 mb-5 text-3xl shadow-inner bg-blue-50 rounded-2xl">
          🏦
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">
          Welcome Back
        </h1>
        <p class="mt-2 font-medium text-gray-500 text-md">
          Sign in to your UPI account
        </p>
      </div>

      <!------ Floating Alerts ------>
      <div *ngIf="errorMessage" class="flex items-center justify-between p-4 mb-6 transition-all border border-red-200 bg-red-50 text-red-700 rounded-2xl animate-slideDown" role="alert">
        <div class="flex items-center gap-3">
          <span class="text-xl">❌</span>
          <p class="text-sm font-semibold">{{ errorMessage }}</p>
        </div>
        <button (click)="clearError()" class="text-lg font-bold text-red-400 transition-colors hover:text-red-700 active:scale-95">✕</button>
      </div>

      <div *ngIf="successMessage" class="flex items-center justify-between p-4 mb-6 transition-all border border-emerald-200 bg-emerald-50 text-emerald-700 rounded-2xl animate-slideDown" role="alert">
        <div class="flex items-center gap-3">
          <span class="text-xl">✅</span>
          <p class="text-sm font-semibold">{{ successMessage }}</p>
        </div>
        <button (click)="clearSuccess()" class="text-lg font-bold text-emerald-400 transition-colors hover:text-emerald-700 active:scale-95">✕</button>
      </div>

      <!------ Login Form ------>
      <form [formGroup]="loginForm" (ngSubmit)="OnLogin()" class="space-y-5">
        
        <!-- Email field -->
        <div>
          <label for="email" class="block mb-2 text-xs font-bold tracking-widest text-gray-400 uppercase">
            Email Address
          </label>
          <input type="email" id="email" placeholder="name@example.com" formControlName="email"
            class="w-full px-4 py-3.5 font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
            [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['email'].errors}">

          <!-- Validation errors-->
          <div *ngIf="submitted && f['email'].errors" class="flex items-center gap-1 mt-2 text-xs font-bold text-red-500 animate-fadeIn">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block mb-2 text-xs font-bold tracking-widest text-gray-400 uppercase">
            Password
          </label>
          <input type="password" id="password" placeholder="••••••••" formControlName="password" 
            class="w-full px-4 py-3.5 font-semibold text-gray-800 border border-gray-200 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all"
            [ngClass]="{'border-red-400 focus:ring-red-500 bg-red-50': submitted && f['password'].errors}">

          <!-- Validation error-->
          <div *ngIf="submitted && f['password'].errors" class="flex flex-col gap-1 mt-2 text-xs font-bold text-red-500 animate-fadeIn">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must contain at least 6 characters</span>
          </div>
        </div>
        
        <!------ Login Button ------>
        <div class="pt-4">
          <button type="submit" [disabled]="loading" 
            class="flex items-center justify-center w-full py-4 text-lg font-bold text-white transition-all shadow-xl bg-green-900 hover:bg-green-800 rounded-2xl active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed disabled:active:scale-100">
            
            <!-- Normal state -->
            <span *ngIf="!loading">Sign In securely</span>

            <!-- Loading state -->
            <span *ngIf="loading" class="flex items-center gap-3">
              <div class="w-5 h-5 border-2 border-white rounded-full border-t-transparent animate-spin"></div>
              Authenticating...
            </span>
          </button>
        </div>

      </form>

      <!------ Divider ------>
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-4 font-bold text-gray-400 bg-white">OR</span>
        </div>
      </div>

      <!------ Register Link ------>
      <div class="text-center">
        <p class="font-medium text-gray-500 text-md">
          New to UPI Pay?
          <a routerLink="/register" class="font-bold text-blue-600 transition-colors hover:text-blue-800 hover:underline">
            Create an account
          </a>
        </p>
      </div>

    </div>
  </div>
</div>

<style>
  .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
  .animate-slideDown { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
