spring:
  application:
    name: Transaction-service

  datasource:
    url: jdbc:mysql://localhost:3306/upi_transaction_db
    username: root
    password: Kunalroot123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8083

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-register: true
  instance:
    prefer-ip-address: true

# Encryption keys (will use in transaction processing)
encryption:
  rsa:
    algorithm: RSA
    keySize: 2048
  aes:
    algorithm: AES
